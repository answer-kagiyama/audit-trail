name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # seed.sql と database.sqlite のズレを検出する。
      # .sqlite は生成物なので、手で編集されたり再生成し忘れたりすると
      # ここで落ちる。
      - name: CASE DB が seed.sql と一致しているか
        run: npm run cases:check

      # AGENTS.md: この4つが緑になるまで完了としない。
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: format check
        run: npm run format:check

      # 実ブラウザでしか壊れないもの（Worker / CodeMirror / ダイアログ /
      # テーマ / localStorage）を通しで確かめる。
      - name: install playwright browser
        run: npx playwright install --with-deps chromium

      - name: e2e
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
